<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Next Shift{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <style>
        .glow-urgent { border-color: var(--bs-danger); box-shadow: 0 0 12px rgba(var(--bs-danger-rgb), 0.6); }
        .glow-today { border-color: var(--bs-warning); box-shadow: 0 0 12px rgba(var(--bs-warning-rgb), 0.6); }
        .glow-fyi { border-color: var(--bs-success); box-shadow: 0 0 12px rgba(var(--bs-success-rgb), 0.6); }
        .btn-primary {
            --bs-btn-bg: #d63384;
            --bs-btn-border-color: #d63384; 
            --bs-btn-hover-bg: #ab296a;
            --bs-btn-hover-border-color: #ab296a;
            --bs-btn-active-bg: #ab296a;
            --bs-btn-active-border-color: #ab296a;
        }
        .alert-pink {
            --bs-alert-color: #e685b5;
            --bs-alert-bg: rgba(214, 51, 132, 0.15);
            --bs-alert-border-color: rgba(214, 51, 132, 0.5);
        }
        .glow-pink { border-color: #d63384; box-shadow: 0 0 12px rgba(214, 51, 132, 0.6); }
        .text-pink { color: #e685b5 !important; }
        .btn-outline-pink {
            --bs-btn-color: #e685b5;
            --bs-btn-border-color: #d63384;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #d63384;
            --bs-btn-hover-border-color: #d63384;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: #ab296a;
            --bs-btn-active-border-color: #ab296a;
        }
        [data-bs-theme="dark"] {
            --bs-body-bg: #16181b;
        }
    </style>
</head>
<body>
    <nav class="navbar bg-body-tertiary border-bottom mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold text-pink">Next Shift</span>
            {% block nav_right %}
            {% if request.session.nurse_id %}
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-pink">{{ request.session.nurse_name }} · {{ request.session.day }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-pink btn-sm">Log Out</button>
                </form>
            </div>
            {% endif %}
            {% endblock %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

</body>
</html>
